[project]
name = "gym-erp-api"
version = "0.1.0"
description = "Gym ERP API — FastAPI monolith"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.14,<5",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_erp_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: pruebas contra MongoDB real; requieren GYM_ERP_RUN_INTEGRATION=1",
    "tenant_isolation: aislamiento multi-tenant contra MongoDB de prueba (H1-C)",
    "organization_persistence: round-trip repos organization contra MongoDB de prueba (H1-D)",
    "organization_transactions: MongoUnitOfWork multi-base organization (H1-D.3.2.1)",
    "organization_create_organization: CreateOrganizationHandler transaccional (H1-D.3.3.4)",
    "identity_persistence: persistencia identity/credenciales/sesiones en gym_platform_test (H2-B.3)",
    "identity_mfa: MFA TOTP platform en gym_platform_test (H2-B.5)",
    "http_security: rate limit / CSRF HTTP contra gym_platform_test (H2-B.7.1.1)",
    "access_persistence: membresías access en gym_platform_test (H2-C.2)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
